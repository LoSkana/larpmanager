[project]
name = "larpmanager"
version = "1.0.0"
description = "A Django-based web application for managing LARP (Live Action Role-Playing) events"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
  {name = "Scanagatta Mauro"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
]

dependencies = [
  "anthropic==1.7.0",
  "asgiref==3.12.1",
  "babel==2.18.0",
  "beautifulsoup4==4.15.0",
  "brotli==1.2.0",
  "calmjs.parse==1.3.3",
  "cryptography==50.0.1",
  "csscompressor==0.9.5",
  "deepl==1.32.0",
  "diff-match-patch==20241021",
  "django==5.2.17",
  "django-admin-autocomplete-filter==0.7.1",
  "django-allauth==65.19.4",
  "django-axes==8.3.1",
  "django-otp==1.7.3",
  "qrcode[pil]==8.2",
  "django-clone==5.5.0",
  "django-colorfield==0.14.0",
  "django-db-connection-pool==1.2.6",
  "django-import-export==4.4.1",
  "django-phonenumber-field==8.5.0",
  "django-postgrespool2==2.0.5",
  "django-ratelimit==4.1.0",
  "django-recaptcha==4.1.0",
  "django-redis==7.0.0",
  "django-select2==8.4.8",
  "django-silk==5.6.0",
  "django-simple-history==3.13.0",
  "django-tinymce==5.0.0",
  "django4-background-tasks==1.2.10",
  "django-compressor==4.6.0",
  "django-cors-headers==4.9.0",
  "django-csp==4.0",
  "django-debug-toolbar==8.0.0",
  "django-imagekit==6.1.1",
  "django-paypal==2.1",
  "django-registration==5.2.1",
  "django-request-profiler==1.1",
  "django-safedelete==1.5.0",
  "factory-boy==3.3.3",
  "gunicorn==26.2.0",
  "hiredis==3.4.1",
  "holidays==0.105",
  "html5lib==1.1",
  "httpx==0.28.1",
  "humanize==4.16.0",
  "inflection==0.5.1",
  "jellyfish==1.2.1",
  "lxml==6.1.3",
  "olefile==0.47",
  "pandas==3.0.6",
  "pdfkit==1.0.0",
  "phonenumbers==9.0.39",
  "pilkit==3.0",
  "pillow==12.3.0",
  "playwright==1.63.0",
  "polib==1.2.0",
  "psycopg2-binary==2.9.13",
  "pycountry==26.2.16",
  "pyjwt==2.14.0",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-factoryboy==2.8.1",
  "pytest-playwright==0.9.0",
  "pytest-rerunfailures==16.7",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "python-dateutil==2.9.0.post0",
  "python-magic==0.4.27",
  "python-redsys==1.2.0",
  "python-slugify==8.0.4",
  "python3-openid==3.2.0",
  "python3-saml==1.16.0",
  "pytz==2026.3.post1",
  "pyyaml==6.0.3",
  "requests==2.34.2",
