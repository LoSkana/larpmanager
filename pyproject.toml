[project]
name = "larpmanager"
version = "1.0.0"
description = "A Django-based web application for managing LARP (Live Action Role-Playing) events"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
authors = [
  {name = "Scanagatta Mauro"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Framework :: Django",
  "Framework :: Django :: 6.1",
]

dependencies = [
  "anthropic==2.3.0",
  "asgiref==3.13.0",
  "babel==2.18.0",
  "beautifulsoup4==4.15.0",
  "cryptography==50.0.2",
  "deepl==1.32.0",
  "diff-match-patch==20241021",
  "django==6.1.2",
  "django-allauth==65.21.0",
  "django-axes==8.3.1",
  "django-otp==1.7.5",
  "qrcode[pil]==8.2",
  "django-clone==5.5.0",
  "django-colorfield==0.14.0",
  "django-db-connection-pool==1.2.6",
  "django-import-export==4.4.4",
  "django-phonenumber-field==9.0.0",
  "django-ratelimit==4.1.0",
  "django-recaptcha==4.1.0",
  "django-redis==7.0.0",
  "django-select2==8.4.8",
  "django-tinymce==5.0.0",
  "django4-background-tasks==1.2.10",
  "django-compressor==4.6.0",
  "django-cors-headers==4.9.0",
  "django-debug-toolbar==8.0.0",
  "django-imagekit==6.1.1",
  "django-paypal==2.1",
  "django-registration==5.2.1",
  "django-safedelete==1.5.0",
  "gunicorn==26.2.0",
  "hiredis==3.5.0",
  "holidays==0.107",
  "html5lib==1.1",
  "httpx==0.28.1",
  "inflection==0.5.1",
  "lxml==6.1.3",
  "pandas==3.1.0",
  "phonenumbers==9.0.42",
  "pilkit==3.0",
  "pillow==13.0.0",
  "playwright==1.64.1",
  "polib==1.2.0",
  "psycopg2-binary==2.9.13",
  "pycountry==26.2.16",
  "pyjwt==2.15.1",
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "pytest-playwright==0.10.0",
  "pytest-rerunfailures==16.7",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "python-dateutil==2.9.0.post0",
  "python-magic==0.4.27",
  "python-redsys==2.1.0",
  "python-slugify==9.1.3",
  "pytz==2026.5",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "ruff==0.17.3",
  "setuptools==84.2.1",
  "stripe==16.0.1",
  "tzdata==2026.6",
  "xhtml2pdf==0.2.28",
  "boto3>=1.42.54",
]

[tool.setuptools.packages.find]
include = ["larpmanager*", "main*"]

[tool.djlint]
ignore="H006,T002"
extend_exclude="static/,larpmanager/static/"

[tool.ruff]
line-length = 120
extend-exclude = ["main", "*/migrations/*", "*/tests/*", "scripts/*", "manage.py", ".claude"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
	"ISC001", # Implicit string concatenation, ignored to use ruff formatter
	"E501", # Line too long, ignored to use ruff formatter
	"D100", # Missing docstring in public module
	"D104", # Missing docstring in public package
	"D106", # Missing docstring in public nested class, would be useless on Meta
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
    "FIX002",  # Line contains TODO
    "DJ001",  # TODO remove django-nullable-model-string-field
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
