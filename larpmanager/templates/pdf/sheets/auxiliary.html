<!DOCTYPE html>
<html lang="en">
    {% load show_tags i18n %}
    <head>
        <meta charset="utf-8">
        <title>{{ sheet_char.name }}</title>
        <meta charset="utf-8">
        <meta name="keywords" content="none">
        <meta name="description" content="none">
        <style>
            table {
                width: 100%;
            }

            td,
            th {
                text-align: center;
            }

            .clear {
                clear: both;
            }

            #char_name,
            .c {
                text-align: center;
            }

            .show_char {
                display: none;
            }

            .inline-p p {
                display: inline;
            }

            .inline-p + .inline-p {
                margin-top: 0.5em;
            }

            #char_present .hide-screen {
                display: none;
            }

            #char_present .go-inline + .go-inline .hide-screen {
                display: inline;
            }

            h2, h3, .c {
                text-align: left;
                margin-left: 2em;
                font-style: italic;
                font-weight: bold;
                font-size: 120%;
            }

            .inline-p p {
                display: inline;
            }
        </style>
        <style>{{ page_css | safe }}</style>
    </head>
    <body>
        <!-- Content for Static Frame 'header_frame' -->
        <div id="header_content">{{ header_content | safe }}</div>
        <!-- Content for Static Frame 'footer_frame' -->
        <div id="footer_content">{{ footer_content | safe }}</div>
        <!-- HTML Content -->
        <div>
            {% if intro %}{{ intro | safe }}{% endif %}
            {% include "elements/sheet/main.html" %}
        </div>
    </body>
</html>
