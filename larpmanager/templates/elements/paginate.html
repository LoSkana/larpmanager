<table id="{{ table_name }}"
       class="pagin_datatable"
       url="{{ request.path }}">
    <thead>
        <tr>
            <th></th>
            <th></th>
            {% for field in fields %}
                <th {% if field.0 in unsortable_fields %}no_sort{% endif %}>{{ field.1 }}</th>
            {% endfor %}
            {% if delete_view %}<th></th>{% endif %}
        </tr>
    </thead>
</table>
