{% load i18n %}
<p class="error-actions">
    <a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> {% trans "Go to the home page" %}</a>
    {% if not user.is_authenticated %}
        <a href="{% url 'login' %}?next={{ request.path|urlencode }}"><i class="fa-solid fa-right-to-bracket"></i> {% trans "Log in" %}</a>
    {% endif %}
</p>
