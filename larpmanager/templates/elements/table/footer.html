{% load i18n %}
{% if not demo %}
    {% if upload or download or export or bulk %}
        <div class="staff-list table-footer only_v22">
            <div class="orga-buttons">
                {% if upload %}
                    <a class="new button" href="{% url 'orga_upload' run.get_slug upload %}">
                        <i class="fas fa-upload"></i>
                        {% trans "Upload" %}
                    </a>
                {% endif %}
                {% if download %}
                    <form action="{{ request.path }}" method="post" class="inline">
                        {% csrf_token %}
                        <input type="hidden" name="download" value="1">
                        <button type="submit" name="submit" value="1">
                            <i class="fas fa-download"></i>
                            {% trans "Download" %}
                        </button>
                    </form>
                {% endif %}
                {% if export %}
                    <a class="new button" href="{% url 'orga_export' run.get_slug export %}">
                        <i class="fas fa-file-export"></i>
                        {% trans "Export" %}
                    </a>
                {% endif %}
                {% if bulk %}
                    <a class="new button my_toggle" tog='bulk' href="#">
                        <i class="fas fa-tasks"></i>
                        Bulk
                    </a>
                {% endif %}
            </div>
        </div>
    {% endif %}
{% endif %}
